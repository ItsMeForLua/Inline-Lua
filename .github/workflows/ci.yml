# .github/workflows/ci.yml
name: CI/CD for Inline-Lua

permissions:
  contents: read

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        perl:
          - '5.8'
          - '5.10'
          - '5.12'
          - '5.14'
          - '5.16'
          - '5.18'
          - '5.20'
          - '5.22'
          - '5.24'
          - '5.26'
          - '5.28'
          - '5.30'
          - '5.32'
          - '5.34'
          - '5.36'
          - '5.38'
        include:
          - os: ubuntu-latest
            perl: devel
        exclude:
          - os: windows-latest
            perl: '5.8'
          - os: windows-latest
            perl: '5.10'

    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install system dependencies (Lua)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y liblua5.3-dev
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install lua
          elif [ "$RUNNER_OS" == "Windows" ]; then
            scoop install lua
            # Set ENV for Makefile.PL to find Lua
            echo "LUA_LIB_PATH=C:\Users\runneradmin\scoop\apps\lua\current\lib" >> $env:GITHUB_ENV
            echo "LUA_INC_PATH=C:\Users\runneradmin\scoop\apps\lua\current\include" >> $env:GITHUB_ENV
          fi

      - name: Install Perl Dependencies
        run: cpanm --installdeps .

      - name: Build and Test
        run: |
          perl Makefile.PL
          make
          make test

      - name: Run Author/Extended Tests
        if: matrix.perl >= 5.22 # Author tests often use modern syntax
        run: |
          cpanm --notest Test::Perl::Critic Test::Pod Test::Pod::Coverage
          make test-author
