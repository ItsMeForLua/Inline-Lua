# .github/workflows/ci.yml
name: CI/CD for Inline-Lua
# IMPORTANT:
# Sets default permissions to be read-only for security
permissions:
  contents: read

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        perl:
          - 5.8
          - 5.16
          - 5.22
          - 5.30
          - 5.36
          - 5.38
        include:
          - os: ubuntu-latest
            perl: devel
        exclude:
          - os: windows-latest
            perl: 5.8
          - os: windows-latest
            perl: 5.16

    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          # The action should automatically select the correct distribution for each OS.

      - name: Install system dependencies (Lua)
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y liblua5.3-dev
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install lua
          elif [ "$RUNNER_OS" == "Windows" ];then
            scoop install lua
            echo "LUA_LIB_PATH=C:\Users\runneradmin\scoop\apps\lua\current\lib" >> $env:GITHUB_ENV
            echo "LUA_INC_PATH=C:\Users\runneradmin\scoop\apps\lua\current\include" >> $env:GITHUB_ENV
            echo "PATH=C:\Users\runneradmin\scoop\apps\lua\current\bin;${env:PATH}" >> $env:GITHUB_ENV
          fi
        shell: bash

      - name: Install Perl Dependencies
        run: |
          cpanm --notest Inline Test::Exception

      - name: Build and Test
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            perl Makefile.PL INC="-I$env:LUA_INC_PATH" LIBS="-L$env:LUA_LIB_PATH -llua53"
          else
            perl Makefile.PL
          fi
          make
          make test TEST_VERBOSE=1

      - name: Run Author/Extended Tests
        if: matrix.perl >= 5.22 # NOTE: Author tests often use modern syntax
        continue-on-error: true
        run: |
          if [ -d "xt" ]; then
            cpanm --notest Test::Perl::Critic Test::Pod Test::Pod::Coverage
            prove -lv -r xt
          fi
